{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Страницы списка">
  {% if page_obj.has_previous %}<a class="button secondary" rel="prev" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Назад</a>{% else %}<span></span>{% endif %}
  <span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="button secondary" rel="next" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Далее</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
